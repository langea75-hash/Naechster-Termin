<!DOCTYPE html>
<html lang="de">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="theme-color" content="#f4f6f8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8; color: #111; min-height: 100vh;
      display: flex; justify-content: center; align-items: center; padding: 20px;
    }
    .card {
      width: min(630px, 100%); background: #fff; border-radius: 28px;
      padding: 46px 32px; box-shadow: 0 12px 35px rgba(0,0,0,.10); text-align: center;
    }
    .heading { font-size: clamp(32px, 8vw, 50px); font-weight: 800; margin-bottom: 48px; }
    .title { font-size: clamp(30px, 7vw, 46px); line-height: 1.28; font-weight: 800; margin-bottom: 34px; }
    .date { font-size: clamp(24px, 6vw, 39px); line-height: 1.3; margin-bottom: 22px; }
    .remaining { font-size: clamp(22px, 5.5vw, 34px); font-weight: 750; margin: 8px 0; }
    .countdown { font-size: clamp(24px, 6vw, 38px); font-weight: 800; font-variant-numeric: tabular-nums; margin-bottom: 28px; }
    .location { font-size: clamp(21px, 5vw, 32px); line-height: 1.3; }
    .status { font-size: 22px; color: #666; }
  </style>
</head>
<body>
  <main class="card">
    <div id="loading" class="status">Google Kalender wird gelesen …</div>
    <div id="content" hidden>
      <div class="heading">📅 Nächster Termin</div>
      <div id="title" class="title"></div>
      <div id="date" class="date"></div>
      <div id="remaining" class="remaining"></div>
      <div id="countdown" class="countdown"></div>
      <div id="location" class="location"></div>
    </div>
    <div id="empty" class="status" hidden>Kein zukünftiger Termin in den nächsten 30 Tagen gefunden.</div>
  </main>

<script>
  let currentEvent = null;
  let timer = null;

  function loadEvent() {
    google.script.run
      .withSuccessHandler(showEvent)
      .withFailureHandler(showError)
      .getNextEvent();
  }

  function showEvent(data) {
    document.getElementById('loading').hidden = true;

    if (!data || !data.found) {
      document.getElementById('content').hidden = true;
      document.getElementById('empty').hidden = false;
      currentEvent = null;
      if (timer) clearInterval(timer);
      return;
    }

    document.getElementById('empty').hidden = true;
    document.getElementById('content').hidden = false;
    currentEvent = data;

    document.getElementById('title').textContent = data.title;

    const start = new Date(data.start);
    const options = data.allDay
      ? { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' }
      : { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' };

    document.getElementById('date').textContent =
      new Intl.DateTimeFormat('de-DE', options).format(start);

    const loc = document.getElementById('location');
    if (data.location) {
      loc.textContent = '📍 ' + data.location;
      loc.hidden = false;
    } else {
      loc.hidden = true;
    }

    updateCountdown();
    if (timer) clearInterval(timer);
    timer = setInterval(updateCountdown, 1000);
  }

  function updateCountdown() {
    if (!currentEvent) return;

    let diff = new Date(currentEvent.start).getTime() - Date.now();

    if (diff <= 0) {
      document.getElementById('remaining').textContent = '⏳ Jetzt';
      document.getElementById('countdown').textContent = 'Countdown: 00:00:00';
      setTimeout(loadEvent, 1500);
      return;
    }

    const totalMinutes = Math.floor(diff / 60000);
    const totalHours = Math.floor(totalMinutes / 60);
    const minutes = totalMinutes % 60;

    document.getElementById('remaining').textContent =
      `⏳ Noch ${totalHours} Std. ${minutes} Minuten`;

    const totalSeconds = Math.floor(diff / 1000);
    const hh = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
    const mm = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
    const ss = String(totalSeconds % 60).padStart(2, '0');

    document.getElementById('countdown').textContent =
      `Countdown: ${hh}:${mm}:${ss}`;
  }

  function showError(err) {
    document.getElementById('loading').textContent =
      'Fehler beim Lesen des Kalenders: ' + (err && err.message ? err.message : err);
  }

  loadEvent();
  setInterval(loadEvent, 5 * 60 * 1000);
</script>
</body>
</html>
