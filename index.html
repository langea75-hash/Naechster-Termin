<!DOCTYPE html>
<html lang="de">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="theme-color" content="#ffffff">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #111827;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      width: min(520px, 100%);
      background: white;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 14px 35px rgba(0,0,0,.10);
    }
    .small {
      font-size: 15px;
      color: #667085;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 30px;
      line-height: 1.15;
      margin: 0 0 18px;
    }
    .countdown {
      font-size: clamp(34px, 10vw, 58px);
      font-weight: 800;
      letter-spacing: -1px;
      margin: 18px 0;
      font-variant-numeric: tabular-nums;
    }
    .date {
      font-size: 20px;
      font-weight: 650;
      margin-top: 6px;
    }
    .location {
      margin-top: 12px;
      font-size: 17px;
    }
    button {
      margin-top: 24px;
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      background: #111827;
      color: white;
    }
    .status {
      text-align: center;
      color: #667085;
      padding: 28px 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <div id="loading" class="status">Google Kalender wird gelesen …</div>

    <div id="content" hidden>
      <div class="small">Nächster Termin</div>
      <h1 id="title">Termin</h1>
      <div id="countdown" class="countdown">--:--:--</div>
      <div id="date" class="date"></div>
      <div id="location" class="location"></div>
      <button onclick="loadEvent()">Aktualisieren</button>
    </div>

    <div id="empty" class="status" hidden>
      Kein Termin in den nächsten 30 Tagen gefunden.
      <button onclick="loadEvent()">Neu prüfen</button>
    </div>
  </main>

<script>
  let currentEvent = null;
  let timer = null;

  function loadEvent() {
    document.getElementById('loading').hidden = false;
    document.getElementById('content').hidden = true;
    document.getElementById('empty').hidden = true;

    google.script.run
      .withSuccessHandler(showEvent)
      .withFailureHandler(showError)
      .getNextEvent();
  }

  function showEvent(data) {
    document.getElementById('loading').hidden = true;

    if (!data || !data.found) {
      document.getElementById('empty').hidden = false;
      currentEvent = null;
      if (timer) clearInterval(timer);
      return;
    }

    currentEvent = data;
    document.getElementById('content').hidden = false;
    document.getElementById('title').textContent = data.title;

    const start = new Date(data.start);
    const options = data.allDay
      ? { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' }
      : { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric',
          hour:'2-digit', minute:'2-digit' };

    document.getElementById('date').textContent =
      new Intl.DateTimeFormat('de-DE', options).format(start);

    const loc = document.getElementById('location');
    if (data.location) {
      loc.textContent = '📍 ' + data.location;
      loc.hidden = false;
    } else {
      loc.hidden = true;
    }

    updateCountdown();
    if (timer) clearInterval(timer);
    timer = setInterval(updateCountdown, 1000);
  }

  function updateCountdown() {
    if (!currentEvent) return;

    const start = new Date(currentEvent.start).getTime();
    const now = Date.now();
    let diff = start - now;

    const el = document.getElementById('countdown');

    if (diff <= 0) {
      el.textContent = 'Jetzt';
      return;
    }

    const days = Math.floor(diff / 86400000);
    diff %= 86400000;
    const hours = Math.floor(diff / 3600000);
    diff %= 3600000;
    const minutes = Math.floor(diff / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    const hh = String(hours).padStart(2, '0');
    const mm = String(minutes).padStart(2, '0');
    const ss = String(seconds).padStart(2, '0');

    el.textContent = days > 0
      ? `${days} T ${hh}:${mm}:${ss}`
      : `${hh}:${mm}:${ss}`;
  }

  function showError(err) {
    document.getElementById('loading').textContent =
      'Fehler beim Lesen des Kalenders: ' + (err && err.message ? err.message : err);
  }

  loadEvent();
  setInterval(loadEvent, 5 * 60 * 1000);
</script>
</body>
</html>
